      <Prose eyebrow="Legal" title="Privacy policy" updated="11 September 2025">
        <p className="lede">This policy describes how your information is collected, used and disclosed when you use Musician's Toolbox, and what your rights are. It also covers your responsibilities when using the app's search functionality.</p>
        <p>Your data is used to provide and improve the Service. By using the Service you agree to the collection and use of information in accordance with this policy.</p>
        <h2>Definitions</h2>
        <ul>
          <li><strong>Application</strong> — the software program provided by me and downloaded by you on any electronic device, named "Musician's Toolbox".</li>
          <li><strong>I</strong> ("I", "me", "my") — the developer of the Musician's Toolbox application.</li>

          <li><strong>Service Provider</strong> — any natural or legal person who processes the data on my behalf: third-party companies or individuals I employ to facilitate the Service, provide it on my behalf, perform services related to it, or assist me in analysing how it is used.</li>
          <li><strong>Usage Data</strong> — data collected automatically, either generated by use of the Service or from the Service infrastructure itself (for example, the duration of a page visit).</li>
          <li><strong>You</strong> — the individual accessing or using the Service, or the company or other legal entity on behalf of which such individual is accessing or using the Service.</li>
          <li><strong>Policy</strong> — this document.</li>
        </ul>
        <h2>Collecting and using your data</h2>
        <h3>Usage data</h3>
        <p>Usage Data is collected automatically when using the Service. It may include your device's Internet Protocol address (e.g. IP address), unique device identifiers, the type of mobile device you use, your mobile operating system, and other diagnostic data. This data is used for analytics, to help me understand how users interact with the app and to identify areas for improvement.</p>
        <h3>User-provided content</h3>
        <p>When you use the recording feature or upload a song from your device, this audio data is stored on your device. <strong>At your explicit request</strong>, the audio file is transferred to a secure server. This is done only to enable certain features, such as demixing and chord analysis. The content of these files is not used for any other purpose and is not shared with third parties.</p>
        <h3>Permissions and data collected from your device</h3>
        <p>The app may request permissions to access certain features on your device. These permissions are <strong>entirely optional</strong> and the app remains functional without them. Data collected through these permissions is <strong>not transmitted</strong> off your device unless you initiate the transfer of user-provided content, e.g. by using the demixing tool of the Songs player.</p>
        <ul>
          <li><strong>Microphone</strong> — to enable the tuner functionality and to allow you to record audio.</li>
          <li><strong>External files</strong> — to allow you to upload songs or audio files from your device into the app.</li>
          <li><strong>Notifications</strong> — to send you updates or information about the app's features.</li>
        </ul>
        <h3>Use of your data</h3>
        <ul>
          <li><strong>To provide and maintain the Service</strong>, including monitoring usage of the Application and providing features such as demixing.</li>
          <li><strong>For business transfers</strong> — to evaluate or conduct a merger, divestiture, restructuring, reorganisation, dissolution, or other sale or transfer of some or all of my assets, whether as a going concern or as part of bankruptcy, liquidation or similar proceeding, in which your data is among the assets transferred.</li>
          <li><strong>For other purposes</strong> — such as data analysis, identifying usage trends, determining the effectiveness of promotional campaigns, and evaluating and improving the Service, products and your experience.</li>
        </ul>
        <p>I may share your information with <strong>Service Providers</strong> such as analytics services, in connection with a <strong>business transfer</strong>, or <strong>with your consent</strong> for any other purpose.</p>
        <h2>Third-party content and services</h2>
        <p>The Application's search functionality allows you to search for and retrieve specific content from third-party websites. This functionality only extracts the necessary data for display within the Application and does not provide access to the full website.</p>

        <h2>Links to other websites</h2>
        <p>The Service may contain links to other websites that are not operated by me. If you click a third-party link you will be directed to that third party's site. I strongly advise you to review the privacy policy of every site you visit. I have no control over, and assume no responsibility for, the content, privacy policies or practices of any third-party sites or services.</p>
        <h2>Changes to the policy</h2>
        <p>I may update this policy from time to time. The new policy will be posted on this page and the "last updated" date at the top will be revised. You are advised to review the policy periodically. Changes are effective when they are posted on this page.</p>
        <h2>Contact me</h2>
        <p>If you have any questions about this policy, contact me by email at <a href="mailto:bemain.dev@gmail.com">bemain.dev@gmail.com</a>.</p>
