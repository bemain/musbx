name: Flutter Build & Deploy

on:
  workflow_dispatch:
    inputs:
      android:
        description: 'Build Android'
        type: boolean
        default: true
      ios:
        description: 'Build iOS'
        type: boolean
        default: true
      windows:
        description: 'Build Windows'
        type: boolean
        default: true
      linux:
        description: 'Build Linux'
        type: boolean
        default: true
      bump_build:
        description: 'Increase build number (only if on main)'
        required: false
        type: boolean
        default: true

  release:
    types: [published]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate Version and Build Number
        id: version
        run: |
          VERSION=$(grep "^version:" pubspec.yaml | cut -d' ' -f2)

          # Determine build number
          BUILD=$(echo "$VERSION" | cut -d'+' -f2)
          if [[ "${{ github.event_name }}" == "release"  || "${{ github.event.inputs.bump_build }}" == "true" ]]; then
            BUILD=$((BUILD + 1))
          fi
          echo "build_number=$BUILD" >> $GITHUB_OUTPUT
          
          # Determine version name
          if [[ "${{ github.event_name }}" == "release" ]]; then
            # Strip 'v' from tag (e.g., v1.2.3 -> 1.2.3)
            VERSION=$(echo "${{ github.event.release.tag_name }}" | sed 's/^v//')
          else
            # Get current version from pubspec
            VERSION=$(echo "$VERSION" | cut -d'+' -f1)
          fi
          echo "version_name=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Generate Changelog
        if: github.event_name == 'release'
        uses: orhun/git-cliff-action@v4
        with:
          args: --tag ${{ github.ref_name }}
        env:
          OUTPUT: CHANGELOG.md

      - name: Generate Release Notes
        if: github.event_name == 'release'
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          args: --tag ${{ github.ref_name }} --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Commit changes
        # Only bump version when releasing, or when manually dispatched from main.
        if: github.event_name == 'release' || github.ref_name == 'main'
        run: |
          # Update pubspec.yaml
          VERSION="${{ steps.version.outputs.version_name }}"
          BUILD="${{ steps.version.outputs.build_number }}"
          sed -i "s/^version: .*/version: $VERSION+$BUILD/" pubspec.yaml
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml CHANGELOG.md
          if git diff-index --quiet HEAD --; then
              echo "No changes to commit."
          else
              git commit -m "chore(release): v$VERSION+$BUILD [skip ci]"
          fi
          git push origin HEAD:main

      - name: Update Release details
        if: github.event_name == 'release'
        run: |
          gh release edit ${{ github.event.release.tag_name }} --notes "${{ steps.changelog.outputs.content }}"
          # Retag
          git tag -d ${{ github.event.release.tag_name }} || true
          git tag ${{ github.event.release.tag_name }}
          git push origin ${{ github.event.release.tag_name }} --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  build-android:
    needs: prepare
    if: github.event_name == 'release' || github.event.inputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'release' && 'main' || github.ref_name }}

      - uses: ./.github/actions/setup-flutter
        with:
          keys_file: ${{ secrets.KEYS_FILE }}

      - name: Decode Android files
        run: |
          echo "${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          echo "${{ secrets.ANDROID_KEY_PROPERTIES }}" > android/key.properties
          echo "${{ secrets.ANDROID_SERVICE_ACCOUNT_JSON_BASE64 }}" | base64 --decode > ../musbx-service-account-key.json

      - name: Install JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Ruby & Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Run Fastlane
        working-directory: android
        env:
          CI: true # Tell Fastlane we are in a CI
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          bundle install
          bundle exec fastlane beta

      - name: Upload artifact to release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILE=musbx-android-${{ github.event.release.tag_name }}.aab
          mv build/app/outputs/bundle/release/app-release.aab ${FILE}
          gh release upload ${{ github.event.release.tag_name }} ${FILE}

  build-ios:
    needs: prepare
    if: github.event_name == 'release' || github.event.inputs.ios == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'release' && 'main' || github.ref_name }}

      - uses: ./.github/actions/setup-flutter
        with:
          keys_file: ${{ secrets.KEYS_FILE }}

      - name: Install Ruby & Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Run Fastlane
        working-directory: ios
        env:
          CI: true # Tell Fastlane we are in a CI
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION_BASE64 }}
          APPSTORE_CONNECT_API_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_API_ISSUER_ID }}
          APPSTORE_CONNECT_API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          APPSTORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APPSTORE_CONNECT_API_KEY_CONTENT_BASE64 }}
        run: |
          bundle install
          bundle exec fastlane beta

      - name: Upload artifact to release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILE=musbx-ios-${{ github.event.release.tag_name }}.ipa
          mv ios/Runner.ipa ${FILE}
          gh release upload ${{ github.event.release.tag_name }} ${FILE}

  build-windows:
    needs: prepare
    if: github.event_name == 'release' || github.event.inputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'release' && 'main' || github.ref_name }}

      - uses: ./.github/actions/setup-flutter
        with:
          keys_file: ${{ secrets.KEYS_FILE }}

      - name: Build
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: flutter build windows --release

      - name: Package and upload artifact
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $FILE = "musbx-windows-${{ github.event.release.tag_name }}.zip"
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath $FILE
          gh release upload ${{ github.event.release.tag_name }} $FILE

  build-linux:
    needs: prepare
    if: github.event_name == 'release' || github.event.inputs.linux == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'release' && 'main' || github.ref_name }}

      - uses: ./.github/actions/setup-flutter
        with:
          keys_file: ${{ secrets.KEYS_FILE }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libasound2-dev

      - name: Build
        run: flutter build linux --release

      - name: Package and upload artifact
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pinned to an immutable release tag (not the mutable "continuous" tag) and
          # verified against the SHA256 GitHub recorded for that exact asset.
          APPIMAGETOOL_VERSION: "1.9.1"
          APPIMAGETOOL_SHA256: "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
        run: |
          wget -q "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage" -O appimagetool
          echo "${APPIMAGETOOL_SHA256}  appimagetool" | sha256sum -c -
          chmod +x appimagetool

          mkdir -p AppDir/usr/bin
          cp -r build/linux/x64/release/bundle/* AppDir/usr/bin/
          cp linux/packaging/musbx.desktop AppDir/
          cp assets/logo/logo.png AppDir/musbx.png
          cp linux/packaging/AppRun AppDir/AppRun
          chmod +x AppDir/AppRun

          FILE="musbx-linux-${{ github.event.release.tag_name }}.AppImage"
          ARCH=x86_64 ./appimagetool AppDir "$FILE"
          gh release upload ${{ github.event.release.tag_name }} "$FILE"

