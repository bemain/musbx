name: Setup Flutter build environment
description: Fetch the private material_plus dependency, write keys.dart, and install Flutter

inputs:
  keys_file:
    description: Contents of lib/keys.dart (from the KEYS_FILE secret)
    required: true

runs:
  using: composite
  steps:
    - name: Fetch material_plus dependency
      shell: bash
      run: git clone --depth=1 https://gitlab.com/flutterby-group/material_plus.git ../material_plus

    - name: Write keys.dart to file
      shell: bash
      run: |
        cat << EOF > ./lib/keys.dart
        ${{ inputs.keys_file }}
        EOF

    - name: Install Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: "stable"
        cache: true
