name: Setup Flutter build environment
description: Write keys.dart and install Flutter

inputs:
  keys_file:
    description: Contents of lib/keys.dart (from the KEYS_FILE secret)
    required: true

runs:
  using: composite
  steps:
    - name: Write keys.dart to file
      shell: bash
      run: |
        cat << EOF > ./lib/keys.dart
        ${{ inputs.keys_file }}
        EOF

    - name: Install Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: "stable"
        cache: true
